name: Client and Server tests

on:
  pull_request:
    paths:
      - 'src/client/**'
      - 'src/server/**'
      - '.github/workflows/client-test.yml'
      - '.github/scripts/**'
  push:
    branches:
      - main
      - feature/**
    paths:
      - 'src/client/**'
      - 'src/server/**'
      - '.github/workflows/client-test.yml'
      - '.github/scripts/**'
  # Manual runs; only the database-speed job is limited to them.
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  client-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

  server-unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore GuideAntsApi.sln

      - name: Run API unit tests
        run: dotnet test GuideAntsApi.Tests/GuideAntsApi.Tests.csproj --configuration Release --verbosity minimal

      - name: Test CI helper scripts
        run: python3 ../../.github/scripts/test_flaky_retry.py

      - name: Run ScriptExecutionAgent tests
        run: dotnet test ScriptExecutionAgent.Tests/ScriptExecutionAgent.Tests.csproj --configuration Release --verbosity minimal

  server-integration-test:
    name: server-integration-test (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        db: [SqlServer, Postgres]
    defaults:
      run:
        working-directory: src/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Normalize image owner
        shell: bash
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore
        run: dotnet restore GuideAntsApi.IntegrationTests/GuideAntsApi.IntegrationTests.csproj

      # Known flaky tests (docs/postgres-parity-report.md rows 53 and 54): same
      # race on both providers, pass on rerun. If the full run fails, we retry
      # ONLY when every non-passing result (any outcome except Passed/NotExecuted)
      # is a known-flaky test and the TRX counters agree with that list. The retry
      # uses exact Name= filters and must execute >= 1 test with all passing.
      # Anything else fails the job. Logic and tests: .github/scripts/flaky_retry.py
      - name: Run API integration tests
        shell: bash
        env:
          GA_INTEGRATION_TEST_DB_PROVIDER: ${{ matrix.db }}
          GA_INTEGRATION_TEST_POSTGRES_IMAGE: pgvector/pgvector:0.8.7-pg18
          GA_INTEGRATION_TEST_MSSQL_IMAGE: ghcr.io/${{ env.OWNER_LC }}/mssql2025-express-fts:latest
          GA_ENABLE_RUNTIME_LOAD_TESTS: '0'
        run: |
          PROJ=GuideAntsApi.IntegrationTests/GuideAntsApi.IntegrationTests.csproj
          SCRIPT="$GITHUB_WORKSPACE/.github/scripts/flaky_retry.py"
          KNOWN_FLAKY=(
            SendMessageStream_Cancel_finalizes_partial_message_marks_turn_cancelled_and_prunes_incomplete_tool_calls
            SendMessageStream_Cancel_during_thinking_persists_thinking_without_zero_token_usage
            RecoverStaleTurns_terminalizes_orphaned_streaming_turn_on_sql
          )
          rm -rf "$RUNNER_TEMP/trx1" "$RUNNER_TEMP/trx2"
          if dotnet test "$PROJ" --configuration Release --verbosity minimal \
               --logger "trx;LogFileName=run1.trx" --results-directory "$RUNNER_TEMP/trx1"; then
            exit 0
          fi
          FILTER=$(python3 "$SCRIPT" classify "$RUNNER_TEMP/trx1" "${KNOWN_FLAKY[@]}") \
            || { echo "::error::Failure is not solely known-flaky tests; not retrying."; exit 1; }
          echo "::warning::Retrying known-flaky tests once (parity report rows 53/54): $FILTER"
          dotnet test "$PROJ" --configuration Release --verbosity minimal --no-build --filter "$FILTER" \
            --logger "trx;LogFileName=run2.trx" --results-directory "$RUNNER_TEMP/trx2" || true
          python3 "$SCRIPT" verify "$RUNNER_TEMP/trx2" \
            || { echo "::error::Known-flaky retry did not pass cleanly."; exit 1; }

  database-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Normalize image owner
        shell: bash
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run database parity tests
        env:
          GA_INTEGRATION_TEST_MSSQL_IMAGE: ghcr.io/${{ env.OWNER_LC }}/mssql2025-express-fts:latest
        run: dotnet test GuideAntsApi.DatabaseParity.Tests/GuideAntsApi.DatabaseParity.Tests.csproj --configuration Release --verbosity minimal

  migrations-in-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # has-pending-model-changes exits non-zero when the model differs from the
      # latest migration snapshot, so either provider drifting fails the job.
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 9.0.11

      - name: Migrations in sync (SQL Server)
        run: >
          dotnet ef migrations has-pending-model-changes
          --project GuideAntsApi.DataModel/GuideAntsApi.DataModel.csproj
          --startup-project GuideAntsApi/GuideAntsApi.csproj

      - name: Migrations in sync (Postgres)
        run: >
          dotnet ef migrations has-pending-model-changes
          --project GuideAntsApi.DataModel.Postgres/GuideAntsApi.DataModel.Postgres.csproj
          --startup-project GuideAntsApi/GuideAntsApi.csproj
          -- --provider Postgres

  # Speed comparison of SQL Server and Postgres (samples/database-speed). Manual only
  # (Actions > "Client and Server tests" > Run workflow). ubuntu-latest is x86-64, so the
  # amd64-only SQL Server image runs natively; the harness refuses a full run elsewhere.
  # RESULTS.md is uploaded as an artifact; commit it to samples/database-speed/ by hand.
  database-speed:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        # Inside the sample so its global.json picks the SDK.
        working-directory: samples/database-speed
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so RESULTS.md's "last commit touching src/server" is real.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Normalize image owner
        shell: bash
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Harness unit tests
        run: dotnet test DatabaseSpeed.sln --configuration Release --verbosity minimal

      - name: Run the speed comparison (full)
        env:
          GA_SPEED_MSSQL_IMAGE: ghcr.io/${{ env.OWNER_LC }}/mssql2025-express-fts:latest
          GA_SPEED_POSTGRES_IMAGE: pgvector/pgvector:0.8.7-pg18
        run: dotnet run --configuration Release --no-build --project src/DatabaseSpeed/DatabaseSpeed.csproj

      - name: Upload RESULTS.md
        uses: actions/upload-artifact@v4.6.2
        with:
          name: database-speed-results
          path: samples/database-speed/RESULTS.md
          if-no-files-found: error
